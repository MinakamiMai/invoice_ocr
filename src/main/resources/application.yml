server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: invoice-ocr
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/invoice_ocr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  storage:
    root: ${APP_STORAGE_ROOT:./data/storage}
    max-file-size: ${APP_MAX_FILE_SIZE:10485760}
    preview-ttl-seconds: 600
  security:
    jwt:
      secret: ${JWT_SECRET:invoice-ocr-dev-secret-key-change-me-in-production-0123456789}
      ttl-minutes: ${JWT_TTL_MINUTES:480}
    encryption-key: ${APP_ENCRYPTION_KEY:}
  ocr:
    tesseract:
      datapath: ${TESSERACT_DATAPATH:}
      language: ${TESSERACT_LANGUAGE:chi_sim+eng}
    async:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    reviewer-password: ${SEED_REVIEWER_PASSWORD:Review@123}
    submitter-password: ${SEED_SUBMITTER_PASSWORD:Submit@123}
    auditor-password: ${SEED_AUDITOR_PASSWORD:Audit@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.invoiceocr: INFO
    org.hibernate.SQL: WARN
